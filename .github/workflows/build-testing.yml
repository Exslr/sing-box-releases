name: Build sing-box testing (Android, Windows, Linux, Darwin)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag or temporary tag when building from commit hash (e.g. 1.13.0-rc.4)'
        required: true
      commit_hash:
        description: 'Optional commit hash to build from (overrides version tag)'
        required: false
        default: ''
      build_cli:
        description: 'Build CLI'
        required: false
        type: boolean
        default: true
      build_android_gui:
        description: 'Build Android'
        required: false
        type: boolean
        default: true
      build_windows_gui:
        description: 'Build Windows GUI (requires WINDOWS_CERTIFICATES_P12 / WINDOWS_P12_PASSWORD secrets)'
        required: false
        type: boolean
        default: true
      publish_release:
        description: 'Publish type (a release is always created)'
        required: false
        type: choice
        options:
          - pre-release
          - release
        default: pre-release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true
env:
  GO_VERSION: '1.26.8'
  GO_VERSION_DARWIN: '1.26.8'
jobs:
  resolve_source:
    name: Resolve sing-box source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      display_version: ${{ steps.source.outputs.display_version }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || format('v{0}', inputs.version) }}
          path: sing-box
          fetch-depth: 1
      - name: Resolve source commit
        id: source
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "invalid version: $INPUT_VERSION" >&2
            exit 1
          fi
          source_sha=$(git -C sing-box rev-parse HEAD)
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved sing-box source: ${source_sha}"
          # Source tags/repos stay reF1nd; only the version string used for
          # naming released artifacts is rebranded.
          display_version="${INPUT_VERSION//reF1nd/Exslr}"
          echo "display_version=${display_version}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${display_version}" >> "$GITHUB_OUTPUT"
          echo "Display version: ${display_version}"
          echo "Release tag: v${display_version}"
          echo "publish_release input: [${{ inputs.publish_release }}]"
        env:
          INPUT_VERSION: ${{ inputs.version }}
  build_cli:
    if: ${{ github.event.inputs.build_cli == 'true' }}
    name: Build CLI ${{ matrix.platform }}-${{ matrix.arch }} ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    needs: resolve_source
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - platform: linux
            arch: arm64
            os: ubuntu-26.04
            goos: linux
            goarch: arm64
            goamd64: ''
            binary: sing-box
            variant: purego
            artifact_name: binary-linux-arm64-purego
            naive: true
          - platform: linux
            arch: arm64
            os: ubuntu-26.04
            goos: linux
            goarch: arm64
            goamd64: ''
            binary: sing-box
            variant: glibc
            artifact_name: binary-linux-arm64-glibc
            cgo: '1'
            naive: true
          - platform: linux
            arch: arm64
            os: ubuntu-26.04
            goos: linux
            goarch: arm64
            goamd64: ''
            binary: sing-box
            variant: musl
            artifact_name: binary-linux-arm64-musl
            cgo: '1'
            naive: true
          - platform: linux
            arch: amd64
            os: ubuntu-26.04
            goos: linux
            goarch: amd64
            goamd64: v1
            binary: sing-box
            variant: purego
            artifact_name: binary-linux-amd64-purego
            naive: true
          - platform: linux
            arch: amd64
            os: ubuntu-26.04
            goos: linux
            goarch: amd64
            goamd64: v1
            binary: sing-box
            variant: glibc
            artifact_name: binary-linux-amd64-glibc
            cgo: '1'
            naive: true
          - platform: linux
            arch: amd64
            os: ubuntu-26.04
            goos: linux
            goarch: amd64
            goamd64: v1
            binary: sing-box
            variant: musl
            artifact_name: binary-linux-amd64-musl
            cgo: '1'
            naive: true
          - platform: windows
            arch: arm64
            os: windows-latest
            goos: windows
            goarch: arm64
            goamd64: ''
            binary: sing-box.exe
            variant: purego
            artifact_name: binary-windows-arm64
            naive: true
          - platform: windows
            arch: amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            goamd64: v1
            binary: sing-box.exe
            variant: purego
            artifact_name: binary-windows-amd64
            naive: true
          - platform: windows
            arch: amd64v3
            os: windows-latest
            goos: windows
            goarch: amd64
            goamd64: v3
            binary: sing-box.exe
            variant: purego
            artifact_name: binary-windows-amd64v3
            naive: true
          - platform: darwin
            arch: arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            goamd64: ''
            binary: sing-box
            artifact_name: binary-darwin-arm64
            cgo: '1'
            naive: true
    steps:
      - name: Setup Go for Darwin
        if: matrix.platform == 'darwin'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION_DARWIN }}
          cache: false
      - name: Setup Go
        if: matrix.platform != 'darwin'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ needs.resolve_source.outputs.source_sha }}
          path: sing-box
          fetch-depth: 1
      - name: Set build tag
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          TAG="v${{ needs.resolve_source.outputs.display_version }}"
          git tag -f "${TAG}" "${{ needs.resolve_source.outputs.source_sha }}"
      - name: Cache Go modules for Darwin
        if: matrix.platform == 'darwin'
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: go-mod-macos-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: go-mod-macos-
      - name: Restore Go modules for Linux
        if: matrix.platform == 'linux'
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: go-mod-linux-
      - name: Cache Go modules for Windows
        if: matrix.platform == 'windows'
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: go-mod-windows-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: go-mod-windows-
      - name: Clone cronet-go
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        shell: bash
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go sparse-checkout set --no-cone '/*' '!/lib'
          git -C ~/cronet-go fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1
      - name: Regenerate Debian keyring
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        shell: bash
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
      - name: Download Chromium toolchain
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        shell: bash
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} --libc=musl download-toolchain
          else
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} download-toolchain
          fi
      - name: Set Chromium toolchain environment
        if: matrix.variant == 'glibc' || matrix.variant == 'musl'
        shell: bash
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          if [[ "${{ matrix.variant }}" == "musl" ]]; then
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} --libc=musl env >> $GITHUB_ENV
          else
            go run ./cmd/build-naive --target=linux/${{ matrix.goarch }} env >> $GITHUB_ENV
          fi
      - name: Compute build environment
        id: env
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS_WINDOWS)
          elif [[ "${{ matrix.naive }}" == "true" ]]; then
            TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS)
          else
            TAGS=$(cat sing-box/release/DEFAULT_BUILD_TAGS_OTHERS)
          fi
          if [[ "${{ matrix.naive }}" == "true" && "${TAGS}" != *with_naive_outbound* ]]; then
            TAGS="${TAGS},with_naive_outbound"
          fi
          if [[ -f sing-box/include/ebpf.go && ("${{ matrix.platform }}" == "linux" || "${{ matrix.platform }}" == "android") && "${TAGS}" != *with_ebpf* ]]; then
            TAGS="${TAGS},with_ebpf"
          fi
          ARCHIVE_SUFFIX=""
          case "${{ matrix.variant }}" in
            'purego')
              if [[ "${TAGS}" != *with_purego* ]]; then
                TAGS="${TAGS},with_purego"
              fi
              ;;
            'glibc')
              ARCHIVE_SUFFIX="-glibc"
              ;;
            'musl')
              TAGS="${TAGS},with_musl"
              ARCHIVE_SUFFIX="-musl"
              ;;
          esac
          if [[ "${{ matrix.variant }}" == "purego" && "${{ matrix.platform }}" == "linux" ]]; then
              ARCHIVE_SUFFIX="-purego"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "ldflags=$(cat sing-box/release/LDFLAGS)" >> "$GITHUB_OUTPUT"
          echo "archive_suffix=${ARCHIVE_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "--- Build Environment ---"
          echo "Platform: ${{ matrix.platform }}"
          echo "Arch: ${{ matrix.arch }}"
          echo "Tags: ${TAGS}"
          echo "Archive suffix: ${ARCHIVE_SUFFIX}"
      - name: Build
        shell: bash
        run: |
          set -xeuo pipefail
          cd sing-box
          mkdir -p dist
          go build -v -trimpath -o "dist/${{ matrix.binary }}" \
            -tags "${{ steps.env.outputs.tags }}" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${{ needs.resolve_source.outputs.display_version }} ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
        env:
          LDFLAGS_SHARED: ${{ steps.env.outputs.ldflags }}
          CGO_ENABLED: ${{ matrix.cgo || '0' }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
      - name: Extract libcronet.so
        if: matrix.variant == 'purego' && matrix.platform == 'linux'
        shell: bash
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat sing-box/.github/CRONET_GO_VERSION)
          LIBRARY_PATH="lib/linux_${{ matrix.goarch }}/libcronet.so"
          git init "$RUNNER_TEMP/cronet-go-lib"
          git -C "$RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
          git -C "$RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
          cp "$RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" sing-box/dist/
      - name: Extract libcronet.dll
        if: matrix.variant == 'purego' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $CRONET_GO_VERSION = Get-Content sing-box/.github/CRONET_GO_VERSION
          $LIBRARY_PATH = "lib/windows_${{ matrix.goarch }}/libcronet.dll"
          git init "$env:RUNNER_TEMP/cronet-go-lib"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$env:RUNNER_TEMP/cronet-go-lib" sparse-checkout set --no-cone "/$LIBRARY_PATH"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$env:RUNNER_TEMP/cronet-go-lib" checkout FETCH_HEAD
          Copy-Item "$env:RUNNER_TEMP/cronet-go-lib/$LIBRARY_PATH" sing-box/dist
      - name: Archive (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cd sing-box/dist
          DIR_NAME="sing-box-${{ needs.resolve_source.outputs.display_version }}-linux-${{ matrix.arch }}${{ steps.env.outputs.archive_suffix }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          if [ -f libcronet.so ]; then
              cp libcronet.so "${DIR_NAME}"
          fi
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME" sing-box
          if [ -f libcronet.so ]; then rm -f libcronet.so; fi
      - name: Archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd sing-box/dist
          $DIR_NAME = "sing-box-${{ needs.resolve_source.outputs.display_version }}-windows-${{ matrix.arch }}"
          mkdir "$DIR_NAME"
          Copy-Item ../LICENSE "$DIR_NAME/"
          Copy-Item sing-box.exe "$DIR_NAME/"
          if (Test-Path libcronet.dll) {
              Copy-Item libcronet.dll "$DIR_NAME/"
          }
          Compress-Archive -Path "$DIR_NAME" -DestinationPath "$DIR_NAME.zip"
          Remove-Item -Recurse "$DIR_NAME"
          Remove-Item sing-box.exe
          if (Test-Path libcronet.dll) { Remove-Item libcronet.dll }
      - name: Archive (Darwin)
        if: matrix.platform == 'darwin'
        run: |
          cd sing-box/dist
          DIR_NAME="sing-box-${{ needs.resolve_source.outputs.display_version }}-darwin-${{ matrix.arch }}"
          mkdir -p "$DIR_NAME"
          cp ../LICENSE "$DIR_NAME/"
          cp sing-box "$DIR_NAME/"
          tar -czvf "$DIR_NAME.tar.gz" "$DIR_NAME"
          rm -rf "$DIR_NAME" sing-box
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: sing-box/dist/*
  build_android_library:
    if: ${{ github.event.inputs.build_android_gui == 'true' }}
    name: Build Android library (${{ matrix.go_arch }})
    runs-on: ubuntu-latest
    needs: resolve_source
    strategy:
      fail-fast: false
      matrix:
        # arm -> armeabi-v7a, arm64 -> arm64-v8a. The x86 ABIs are omitted
        # here; the upstream client still splits APKs for them, so the upload
        # step filters those out rather than publishing APKs with no libbox.so.
        go_arch: [arm, arm64]
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ needs.resolve_source.outputs.source_sha }}
          path: sing-box
          fetch-depth: 1
      - name: Set build tag
        run: git -C sing-box tag -f "v${{ needs.resolve_source.outputs.display_version }}" "${{ needs.resolve_source.outputs.source_sha }}"
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: go-mod-linux-
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Build library
        run: |
          set -euo pipefail
          cd sing-box
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/${{ matrix.go_arch }}
          mkdir -p "dist/${{ matrix.go_arch }}"
          mv libbox.aar libbox-legacy.aar "dist/${{ matrix.go_arch }}"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: android-library-${{ matrix.go_arch }}
          path: sing-box/dist
          compression-level: 0
  build_android:
    if: ${{ github.event.inputs.build_android_gui == 'true' }}
    name: Build Android (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [resolve_source, build_android_library]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: other
            task: :app:assembleOtherRelease
            output: app/build/outputs/apk/other/release
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ needs.resolve_source.outputs.source_sha }}
          path: sing-box
          fetch-depth: 1
      - name: Set build tag
        run: git -C sing-box tag -f "v${{ needs.resolve_source.outputs.display_version }}" "${{ needs.resolve_source.outputs.source_sha }}"
      - name: Checkout sing-box-for-android
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box-for-android
          ref: reF1nd-testing
          path: sing-box-for-android
      - name: Checkout submodule recursive
        run: git -C sing-box-for-android submodule update --init --recursive -v
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore Go modules
        uses: actions/cache/restore@v5
        with:
          path: ~/go/pkg/mod
          key: go-mod-linux-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: go-mod-linux-
      - name: Cache Go tool builds
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: go-build-tools-linux-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: go-build-tools-linux-
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic
      - name: Update VERSION_NAME
        run: |
          set -euo pipefail
          file="sing-box-for-android/version.properties"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${{ needs.resolve_source.outputs.display_version }}/" "$file"
          grep '^VERSION_NAME=' "$file"
      - name: Rebrand application identifiers
        run: |
          set -euo pipefail
          # The APK is signed with our own keystore, so it must not keep the
          # upstream application id: Android refuses to install a package whose
          # id matches an installed one under a different signature.
          assert() { grep -qF "$2" "$1" || { echo "missing in $1: $2" >&2; exit 1; }; }

          gradle_file="sing-box-for-android/app/build.gradle.kts"
          updater="sing-box-for-android/app/src/github/java/io/nekohasekai/sfa/vendor/GitHubUpdateChecker.kt"

          assert "$gradle_file" 'applicationId = "io.reF1nd.sfa"'
          assert "$updater" 'repos/reF1nd/sing-box-releases'
          sed -i 's/applicationId = "io\.reF1nd\.sfa"/applicationId = "io.Exslr.sfa"/' "$gradle_file"
          sed -i 's|repos/reF1nd/sing-box-releases|repos/Exslr/sing-box-releases|' "$updater"

          # namespace stays io.nekohasekai.sfa: it names the generated R and
          # BuildConfig classes, not the installed package, and the manifest
          # refers to the id through ${applicationId} placeholders.
          # strings.xml keeps "encrypt with age for reF1nd": that recipient key
          # is reF1nd's, hardcoded in sing-box, so renaming it would mislead.
          grep -n 'applicationId' "$gradle_file"
          grep -n 'RELEASES_URL' "$updater"
      - name: Read version code from source
        run: |
          version_code=$(grep '^VERSION_CODE=' sing-box-for-android/version.properties | cut -d'=' -f2)
          echo "VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
      - name: Download libraries
        uses: actions/download-artifact@v8
        with:
          pattern: android-library-*
          path: libbox-inputs
          merge-multiple: true
      - name: Merge libraries
        run: |
          set -euo pipefail
          cd sing-box
          go run ./cmd/internal/merge_aar -output ../libbox.aar ../libbox-inputs/*/libbox.aar
          go run ./cmd/internal/merge_aar -output ../libbox-legacy.aar ../libbox-inputs/*/libbox-legacy.aar
      - name: Prepare Android client
        run: |
          mkdir -p sing-box-for-android/app/libs
          cp libbox.aar libbox-legacy.aar sing-box-for-android/app/libs/
      - name: Decode Keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_FILE }}" | base64 -d > sing-box-for-android/app/release.keystore
      - name: Build APK
        run: |
          cd sing-box-for-android
          chmod +x gradlew
          ./gradlew --build-cache --parallel ${{ matrix.task }} \
            -Pandroid.injected.signing.store.file=$(pwd)/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}"
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Prepare upload
        run: |
          set -euo pipefail
          mkdir -p dist
          # Publish only the ABIs we build a libbox.so for. The upstream
          # client's gradle ABI split list also covers x86 and x86_64; those
          # APKs are produced without native code and crash on launch.
          src="sing-box-for-android/${{ matrix.output }}"
          for abi in arm64-v8a armeabi-v7a universal; do
            cp "$src"/SFA-*-"$abi".apk dist/
          done
          count=$(find dist -name '*.apk' | wc -l)
          if [[ "$count" -ne 3 ]]; then
            echo "expected 3 APKs, found $count" >&2
            exit 1
          fi
          ls -l dist
          if [[ "${{ matrix.variant }}" == "other" ]]; then
            printf '{\n    "version_code": %s,\n    "version_name": "%s"\n}\n' \
              "$VERSION_CODE" "${{ needs.resolve_source.outputs.display_version }}" > dist/SFA-version-metadata.json
            cat dist/SFA-version-metadata.json
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ matrix.variant }}
          path: dist
  build_windows_gui:
    if: ${{ github.event.inputs.build_windows_gui == 'true' }}
    name: Build Windows GUI (${{ matrix.desktop_arch }})
    runs-on: windows-latest
    needs: resolve_source
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop_arch: x64
            rust_target: x86_64-pc-windows-msvc
          - desktop_arch: arm64
            rust_target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box
          ref: ${{ needs.resolve_source.outputs.source_sha }}
          path: sing-box
          fetch-depth: 1
      - name: Checkout sing-box-for-desktop
        uses: actions/checkout@v6
        with:
          repository: reF1nd/sing-box-for-desktop
          ref: reF1nd-dev
          path: sing-box-for-desktop
          submodules: recursive
      - name: Set build tag
        shell: pwsh
        run: |
          $tag = "v${{ needs.resolve_source.outputs.display_version }}"
          git -C sing-box tag -f $tag "${{ needs.resolve_source.outputs.source_sha }}"
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: go-mod-desktop-windows-${{ hashFiles('sing-box/go.sum') }}
          restore-keys: go-mod-desktop-windows-
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.rust_target }}
      - name: Cache Windows sharing module
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            sing-box-for-desktop/bin/windows-share-toolchain/cargo-target
          key: windows-share-${{ matrix.rust_target }}-${{ hashFiles('sing-box-for-desktop/native/windows-share/Cargo.lock') }}
          restore-keys: windows-share-${{ matrix.rust_target }}-
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          package_json_file: sing-box-for-desktop/package.json
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: sing-box-for-desktop/package.json
          cache: pnpm
          cache-dependency-path: |
            sing-box-for-desktop/pnpm-lock.yaml
            sing-box-for-desktop/dashboard/pnpm-lock.yaml
      - name: Update version
        shell: pwsh
        run: |
          $versionPath = 'sing-box-for-desktop/version.json'
          $versionMetadata = Get-Content -Raw $versionPath | ConvertFrom-Json
          $versionMetadata.version = $env:DESKTOP_VERSION
          $versionMetadata | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8NoBOM $versionPath
          Get-Content $versionPath
        env:
          DESKTOP_VERSION: ${{ needs.resolve_source.outputs.display_version }}
      - name: Rebrand daemon and client identifiers
        shell: bash
        run: |
          set -euo pipefail
          # The daemon authenticates its gRPC peer by opening the client at
          # <install dir>/<applicationExecutableName>, and the client reaches it
          # over a fixed named pipe, so the sing-box constants and the
          # electron-builder productName must be renamed together. Renaming one
          # side alone still builds, then fails at runtime.
          assert() { grep -qF "$2" "$1" || { echo "missing in $1: $2" >&2; exit 1; }; }

          assert sing-box/experimental/boxdd/peer_windows.go 'applicationExecutableName = "sing-box-reF1nd.exe"'
          assert sing-box/experimental/boxdd/main.go 'serviceName = "sing-box-daemon-reF1nd"'
          assert sing-box/experimental/boxdd/server_windows.go 'Administrators\sing-box-reF1nd'
          # Only boxdd holds these as string constants. go.mod and go.sum pin
          # github.com/reF1nd/* dependencies and must keep their paths.
          sed -i 's/reF1nd/Exslr/g' sing-box/experimental/boxdd/*.go
          ! grep -rqF 'reF1nd' sing-box/experimental/boxdd/

          cd sing-box-for-desktop
          assert electron-builder.yml 'productName: sing-box-reF1nd'
          assert src/main/index.ts 'app.setAppUserModelId("io.reF1nd.sfw")'
          # Windows keys only: the linux section references build/io.reF1nd.sfl.*
          # files whose names this step does not rename.
          sed -i \
            -e 's/^appId: io\.github\.reF1nd\.sing-box-desktop/appId: io.github.Exslr.sing-box-desktop/' \
            -e 's/^productName: sing-box-reF1nd/productName: sing-box-Exslr/' \
            -e 's/^  appId: io\.reF1nd\.sfw/  appId: io.Exslr.sfw/' \
            electron-builder.yml
          # These three are rewritten by pattern rather than asserted first, so
          # verify each landed: an upstream reformat would otherwise pass here
          # silently and leave win.appId disagreeing with setAppUserModelId,
          # which only shows up at runtime.
          assert electron-builder.yml 'appId: io.github.Exslr.sing-box-desktop'
          assert electron-builder.yml 'productName: sing-box-Exslr'
          assert electron-builder.yml '  appId: io.Exslr.sfw'
          for file in build/installer.nsh build/installer-preflight.ps1 \
                      build/installer-data.ps1 src/main/applicationPaths.ts \
                      src/main/installationLayout.ts src/main/daemon.ts \
                      src/main/index.ts src/main/appReports.ts \
                      src/main/updates.ts; do
            assert "$file" 'reF1nd'
            sed -i 's/reF1nd/Exslr/g' "$file"
          done
          grep -n 'productName:\|^appId:\|  appId:' electron-builder.yml
          grep -n 'Exslr' src/main/daemon.ts src/main/updates.ts
      - name: Setup signing
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATES_P12)) {
            throw 'WINDOWS_CERTIFICATES_P12 is not configured'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_P12_PASSWORD)) {
            throw 'WINDOWS_P12_PASSWORD is not configured'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'windows-signing.p12'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATES_P12))
          @{
            windows = @{
              certificateFile = $certificatePath
              certificatePassword = $env:WINDOWS_P12_PASSWORD
            }
          } | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8NoBOM sing-box-for-desktop/signing.local.json
        env:
          WINDOWS_CERTIFICATES_P12: ${{ secrets.WINDOWS_CERTIFICATES_P12 }}
          WINDOWS_P12_PASSWORD: ${{ secrets.WINDOWS_P12_PASSWORD }}
      - name: Install dependencies
        run: pnpm -C sing-box-for-desktop install
      - name: Build
        run: pnpm -C sing-box-for-desktop package:win -- ${{ matrix.desktop_arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare upload
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem sing-box-for-desktop/release/SFW-*.exe -File)
          if ($artifacts.Count -ne 1) {
            throw "expected 1 Windows installer for ${{ matrix.desktop_arch }}, found $($artifacts.Count)"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $artifacts.FullName dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-gui-${{ matrix.desktop_arch }}
          path: dist
  finalize_build:
    name: Finalize build artifacts
    runs-on: ubuntu-latest
    needs: [resolve_source, build_cli, build_android_library, build_android, build_windows_gui]
    if: ${{ always() && needs.resolve_source.result == 'success' && (inputs.build_cli || inputs.build_android_gui || inputs.build_windows_gui) && (!inputs.build_cli || needs.build_cli.result == 'success') && (!inputs.build_android_gui || (needs.build_android_library.result == 'success' && needs.build_android.result == 'success')) && (!inputs.build_windows_gui || needs.build_windows_gui.result == 'success') }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download CLI artifacts
        if: inputs.build_cli
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: Download Android artifacts
        if: inputs.build_android_gui
        uses: actions/download-artifact@v8
        with:
          pattern: android-apk-*
          path: artifacts
          merge-multiple: true
      - name: Download Windows GUI artifacts
        if: inputs.build_windows_gui
        uses: actions/download-artifact@v8
        with:
          pattern: windows-gui-*
          path: artifacts
          merge-multiple: true
      - name: Generate build manifest
        run: |
          set -euo pipefail
          {
            while IFS= read -r -d '' file; do
              relative_path=${file#artifacts/}
              sha256=$(sha256sum "$file" | awk '{print $1}')
              size=$(stat -c '%s' "$file")
              jq -nc \
                --arg path "$relative_path" \
                --arg sha256 "$sha256" \
                --argjson size "$size" \
                '{path: $path, sha256: $sha256, size: $size}'
            done < <(find artifacts -type f -print0 | sort -z)
          } | jq -s 'sort_by(.path)' > artifact-files.json
          jq -n \
            --arg workflow '.github/workflows/build-testing.yml' \
            --arg repository "${{ github.repository }}" \
            --arg head_branch "${{ github.ref_name }}" \
            --arg head_sha "${{ github.sha }}" \
            --arg version "${{ needs.resolve_source.outputs.display_version }}" \
            --arg source_sha "${{ needs.resolve_source.outputs.source_sha }}" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson run_id "${{ github.run_id }}" \
            --argjson run_attempt "${{ github.run_attempt }}" \
            --argjson build_cli "${{ inputs.build_cli }}" \
            --argjson build_android_gui "${{ inputs.build_android_gui }}" \
            --argjson build_windows_gui "${{ inputs.build_windows_gui }}" \
            --argjson build_linux_gui false \
            --slurpfile artifact_files artifact-files.json \
            '{
              schema_version: 1,
              workflow: $workflow,
              repository: $repository,
              head_branch: $head_branch,
              head_sha: $head_sha,
              run_id: $run_id,
              run_attempt: $run_attempt,
              version: $version,
              source_sha: $source_sha,
              built_at: $built_at,
              build: {
                cli: $build_cli,
                android_gui: $build_android_gui,
                windows_gui: $build_windows_gui,
                linux_gui: $build_linux_gui
              },
              artifacts: $artifact_files[0]
            }' > build-manifest.json
          jq -e '.artifacts | length > 0' build-manifest.json >/dev/null
          cat build-manifest.json
      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            artifacts/**
            build-manifest.json
      - name: Upload build manifest
        uses: actions/upload-artifact@v7
        with:
          name: build-manifest
          path: build-manifest.json
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [resolve_source, finalize_build]
    if: ${{ always() && needs.resolve_source.result == 'success' && needs.finalize_build.result == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download CLI artifacts
        if: inputs.build_cli
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: Download Android artifacts
        if: inputs.build_android_gui
        uses: actions/download-artifact@v8
        with:
          pattern: android-apk-*
          path: artifacts
          merge-multiple: true
      - name: Download Windows GUI artifacts
        if: inputs.build_windows_gui
        uses: actions/download-artifact@v8
        with:
          pattern: windows-gui-*
          path: artifacts
          merge-multiple: true
      - name: Download build manifest
        uses: actions/download-artifact@v8
        with:
          name: build-manifest
          path: build-metadata
      - name: Generate release notes
        env:
          VERSION: ${{ needs.resolve_source.outputs.display_version }}
        run: |
          set -euo pipefail
          built_at=$(jq -r '.built_at' build-metadata/build-manifest.json)
          {
            echo "## sing-box v${VERSION}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| sing-box Branch | [\`reF1nd-testing\`](https://github.com/reF1nd/sing-box/tree/reF1nd-testing) |"
            echo "| Built At | ${built_at} |"
            echo "| Run ID | [${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } > release-notes.md
          cat release-notes.md
      - name: Update build info
        env:
          VERSION: ${{ needs.resolve_source.outputs.display_version }}
          SOURCE_SHA: ${{ needs.resolve_source.outputs.source_sha }}
          BUILD_INFO_FILE: testing-build-info.json
        run: |
          set -euo pipefail
          built_at=$(jq -r '.built_at' build-metadata/build-manifest.json)
          [[ -f "$BUILD_INFO_FILE" ]] || echo '{}' > "$BUILD_INFO_FILE"
          jq \
            --arg version "$VERSION" \
            --arg built_at "$built_at" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            '.version = $version | .built_at = $built_at | .run_id = $run_id | .source_sha = $source_sha' \
            "$BUILD_INFO_FILE" > updated-build-info.json
          mv updated-build-info.json "$BUILD_INFO_FILE"
          cat "$BUILD_INFO_FILE"
      - name: Commit updated build info
        env:
          TAG: ${{ needs.resolve_source.outputs.release_tag }}
          BUILD_INFO_FILE: testing-build-info.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BUILD_INFO_FILE"
          if git diff --cached --quiet; then
            echo "$BUILD_INFO_FILE is already up to date"
          else
            git commit -m "Release ${TAG}"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Delete existing release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve_source.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${TAG}"
          fi
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release_files
          find artifacts -type f -exec cp '{}' release_files/ ';'
          ls -l release_files
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve_source.outputs.release_tag }}
          name: ${{ needs.resolve_source.outputs.release_tag }}
          prerelease: ${{ inputs.publish_release == 'pre-release' }}
          body_path: release-notes.md
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
  cache_gc:
    name: Cache GC
    if: always()
    runs-on: ubuntu-latest
    needs: finalize_build
    permissions:
      actions: write
    steps:
      - name: Delete superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --paginate \
            --jq '.actions_caches[] | [.id, .ref, .created_at, .last_accessed_at, .size_in_bytes, .key] | @tsv' > "$RUNNER_TEMP/caches.tsv"
          python3 - "$GITHUB_REPOSITORY" "$RUNNER_TEMP/caches.tsv" <<'EOF'
          import re
          import subprocess
          import sys
          repository, list_path = sys.argv[1], sys.argv[2]
          budget = 9 * 1024 * 1024 * 1024
          rows = []
          with open(list_path) as list_file:
              for line in list_file:
                  cache_id, ref, created_at, accessed_at, size, key = line.rstrip("\n").split("\t")
                  family = key
                  while True:
                      stripped = re.sub(r"-[0-9a-f]{16,}$", "", family)
                      if stripped == family:
                          break
                      family = stripped
                  rows.append({
                      "id": cache_id, "ref": ref, "created": created_at,
                      "accessed": accessed_at, "size": int(size), "key": key,
                      "family": family,
                  })
          newest = {}
          for row in rows:
              group = (row["ref"], row["family"])
              if group not in newest or row["created"] > newest[group]["created"]:
                  newest[group] = row
          doomed = [row for row in rows if newest[(row["ref"], row["family"])] is not row]
          kept = [row for row in rows if newest[(row["ref"], row["family"])] is row]
          total = sum(row["size"] for row in kept)
          for row in sorted(kept, key=lambda entry: entry["accessed"]):
              if total <= budget:
                  break
              doomed.append(row)
              total -= row["size"]
          for row in doomed:
              print(f"delete {row['size'] >> 20}MB {row['key']} ({row['ref']})")
              subprocess.run(
                  ["gh", "api", "-X", "DELETE", f"repos/{repository}/actions/caches/{row['id']}"],
                  check=False,
              )
          print(f"kept {len(rows) - len(doomed)} caches, {total >> 20}MB total")
          EOF
